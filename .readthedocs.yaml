# Read the Docs configuration.
# https://docs.readthedocs.com/platform/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

# The command reference is generated from the cyclopts app at build time, so
# y2 itself has to be importable.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
