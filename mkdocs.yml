site_name: y2
site_description: Why have two when one will do?
site_url: https://y2.readthedocs.io/
repo_url: https://github.com/mangoumbrella/y2
repo_name: mangoumbrella/y2
edit_uri: edit/main/docs/
copyright: Copyright &copy; Mango Umbrella LLC

theme:
  name: material
  features:
    - content.action.edit
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

# The generator script lives in docs/, but is not a page.
exclude_docs: |
  gen_pages.py

plugins:
  - search
  # commands.md and changelog.md are generated by this script; they are not
  # checked into docs/.
  - gen-files:
      scripts:
        - docs/gen_pages.py

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Commands: commands.md
  - Changelog: changelog.md
